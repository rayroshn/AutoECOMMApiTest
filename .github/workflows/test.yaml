name: Run Maven Tests and Deploy Allure Report

on:
  push:
    branches:
      - master
      - faker-api-feature
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Create Log directory
        run: mkdir -p src/test/resources/Log
        shell: bash

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set up xvfb
        run: |
          sudo apt-get install xvfb
          export DISPLAY=:99
          Xvfb :99 -ac -screen 0 1280x1024x16 &
        shell: bash

      - name: Diagnose Fake Store response from runner
        run: |
          echo "Checking external Fake Store endpoint from GitHub Actions..."
          curl -i -sS -X POST https://fakestoreapi.com/products \
            -H "Content-Type: application/json" \
            --data '{"title":"ci-diagnostic","price":0.1,"description":"ci-diagnostic","category":"string","image":"http://example.com"}' \
            -o /tmp/fake-store-response.txt
          echo "---- response ----"
          cat /tmp/fake-store-response.txt
        shell: bash

      - name: Build and Test only fakeStoreApiTest
        env:
          DISPLAY: :99
        # run: mvn clean test allure:report
        run: mvn -Dtest=fakeStoreApiTest clean test allure:report
        shell: bash

      - name: Debug - Check Maven build output
        run: |
          echo "Checking target directory:"
          ls -R target
          echo "Checking surefire-reports:"
          cat target/surefire-reports/*.txt
        continue-on-error: true

      - name: Debug - List contents of target directory
        run: ls -R target
        shell: bash

      - name: Debug - Check Allure results existence
        run: |
          if [ -d "target/allure-results" ]; then
            echo "Allure results directory found."
            ls -R target/allure-results
          else
            echo "Allure results directory NOT found."
            echo "Checking other possible locations:"
            ls -R target
          fi
        shell: bash

      - name: Upload Log Files
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: src/test/resources/Log/*.log

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: error

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report
          force_orphan: true

      - name: Check GitHub Pages Status
        run: |
          echo "Checking GitHub Pages deployment status..."
          status_url=$(curl -s -I "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" | grep -i "^location:" | awk '{print $2}' | tr -d '\r')
          echo "GitHub Pages URL: $status_url"
          if [[ $status_url == *"/404.html" ]]; then
            echo "GitHub Pages not deployed yet or encountering issues."
          else
            echo "GitHub Pages seems to be deployed successfully."
          fi
        continue-on-error: true
